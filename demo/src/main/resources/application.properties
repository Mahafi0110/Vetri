spring.application.name=demo

# Tell Render the correct port explicitly  
server.port=${PORT:8080}
spring.mvc.async.request-timeout=-1

# ─── Database ─────────────────────────────────────────────────────────────────

# DATABASE (from ENV)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vetrifile_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Hibernate settings for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# spring.datasource.url=jdbc:h2:mem:testdb
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=password
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=false
# spring.jpa.open-in-view=false
# Enable H2 Console if you want to view tables on Render
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console


# ─── Connection pool (saves ~50MB RAM) ────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# ─── Thymeleaf ────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=false

# ─── File upload limits ───────────────────────────────────────────────────────
# NOTE: Merge Video sends ALL clips in one request, so max-request-size is the
# TOTAL of all clips together. Raise it if you want bigger merges.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
# CRITICAL: stream straight to disk — 50MB upload uses ~0MB heap during HTTP phase
spring.servlet.multipart.file-size-threshold=0B
spring.servlet.multipart.location=/tmp/vetri-uploads

# ─── Tomcat ───────────────────────────────────────────────────────────────────
# Threads (saves ~50MB RAM on Render free tier)
server.tomcat.threads.max=10
server.tomcat.threads.min-spare=2
# Allow large uploads to be fully received even if we reject them later
server.tomcat.max-swallow-size=200MB
server.tomcat.max-http-form-post-size=200MB
# 2 minutes, so a slow upload of a big video is not cut off.
# (This was 30s, and there was a second duplicate setting of 120s above; now just one.)
server.tomcat.connection-timeout=120000

# ─── Async task execution (file processing thread pool) ───────────────────────
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=20
spring.task.execution.thread-name-prefix=vetri-file-

# ─── File storage ─────────────────────────────────────────────────────────────
app.upload.dir=/tmp/uploads
app.output.dir=/tmp/outputs

# ─── App URL ──────────────────────────────────────────────────────────────────
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ─── JWT ──────────────────────────────────────────────────────────────────────
# The part after the colon is used ONLY when JWT_SECRET is not set (your computer).
# On Render, keep JWT_SECRET set to a different, strong secret value.
app.jwt.secret=${JWT_SECRET:local-dev-only-secret-key-change-me-0123456789abcdef}
app.jwt.expiration=86400000

# ─── Cookie / Session ─────────────────────────────────────────────────────────
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# ─── Render reverse proxy ─────────────────────────────────────────────────────
server.forward-headers-strategy=framework

# ─── Health check (keep-alive ping) ───────────────────────────────────────────
management.endpoints.web.exposure.include=health

# ─── Mail ─────────────────────────────────────────────────────────────────────
# Local fallbacks let the app start without the mail variables set.
# (Sending real emails still needs the real MAIL_USERNAME / MAIL_PASSWORD.)
# NOTE: left as it was: port 587 + STARTTLS. Make sure this matches what works on Render.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:local_dev_dummy_user@gmail.com}
spring.mail.password=${MAIL_PASSWORD:local_dev_dummy_password}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ─── Logging (reduced to save RAM) ────────────────────────────────────────────
logging.level.com.example.demo=INFO
logging.level.com.vetri=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web.multipart=WARN
logging.level.org.hibernate=WARN

# Give active requests more time to complete before shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=60s

# ─── Scheduled cleanup (uncomment + add @EnableScheduling to Application.java) ─
# spring.task.scheduling.pool.size=1

# ─── remove.bg ────────────────────────────────────────────────────────────────
# Empty locally, so the app starts. The background remover needs the real key on Render.
app.removebg.api-key=${REMOVE_BG_API_KEY:}