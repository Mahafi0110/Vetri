        :root {
            --blue-dark: #1E3A8A;
            --blue-main: #3B82F6;
            --heading: #1F2937;
            --subtext: #4A5565;
            --accent-1: #F3F4F6;

            --shadow-hover: 0 8px 32px rgba(59, 130, 246, .13);

        *,

        *::after {
            box-sizing: border-box;

        body {
            font-family: 'Inter', sans-serif;
            color: var(--heading);
            background: var(--accent-1);
            overflow-x: hidden;

        h1,
        h2,

        h4,

        /* ── Page Header ── */
        .page-header {
            background: var(--white);
            border-bottom: 1px solid var(--accent-2);
            padding: 20px 0;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: .9rem;
            font-weight: 500;
            color: var(--subtext);
            text-decoration: none;
            transition: color .2s;
        }

        .back-link:hover {
            color: var(--blue-main);
        }

        /* ── File Info Card ── */
        .file-info-card {
            background: var(--white);
            border: 1.5px solid var(--accent-2);
            border-radius: var(--radius-card);
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 32px;
        }

        .file-icon-box {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #fff;
            flex-shrink: 0;
        }

        .fi-pdf {
            background: linear-gradient(135deg, #DC2626, #EF4444);
        }

        .fi-image {
            background: linear-gradient(135deg, #0D9488, #2DD4BF);
        }

        .fi-audio {
            background: linear-gradient(135deg, #7C3AED, #A855F7);
        }

        .fi-video {
            background: linear-gradient(135deg, #DB2777, #F472B6);
        }

            background: linear-gradient(135deg, #1E3A8A, #3B82F6);

            background: linear-gradient(135deg, #4338CA, #8B5CF6);
        }

        .fi-default {
            background: linear-gradient(135deg, #4B5563, #9CA3AF);
        }

        .file-info-text {
            flex: 1;
            min-width: 0;
        }

        .file-name {
            font-family: 'Poppins', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--heading);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

        .file-meta {
            font-size: .85rem;
            color: var(--subtext);
            margin: 0;
        }

        .btn-change-file {
            font-size: .85rem;
            font-weight: 500;
            color: var(--subtext);
            border: 1.5px solid var(--accent-2);
            background: var(--white);
            padding: 8px 18px;
            border-radius: var(--radius-btn);
            transition: border-color .2s, color .2s;
            white-space: nowrap;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-change-file:hover {
            border-color: var(--blue-main);
            color: var(--blue-main);

        /* ── Section heading ── */

            font-size: 1.4rem;
            font-weight: 800;
            color: var(--heading);

            border-color: var(--blue-main);

            background: linear-gradient(135deg, #BE185D, #F472B6);
        }

        .tac-pink-2 {
            background: linear-gradient(135deg, #DB2777, #FB7185);

            }

            .btn-change-file {
                width: 100%;
                text-align: center;
            }
        }

        function getExtension(fileName) {
            if (!fileName || typeof fileName !== 'string') return '';
            const i = fileName.lastIndexOf('.');
            if (i <= 0 || i === fileName.length - 1) return '';
            return fileName.slice(i + 1).toLowerCase();
        }

        function detectCategory(mime, ext) {
            mime = (mime || '').toLowerCase();
            ext = (ext || '').toLowerCase();

            if (mime === 'application/pdf' || ext === 'pdf') return 'pdf';

            // Word documents
            if (
                mime === 'application/msword' ||
                mime === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' ||
                mime === 'application/vnd.ms-word' ||
                ext === 'doc' || ext === 'docx'
            ) return 'word';


            if (mime.startsWith('image/')) return 'image';
            if (['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp', 'svg', 'svgz', 'tiff', 'tif', 'ico', 'avif'].includes(ext)) return 'image';

            if (mime.startsWith('audio/')) return 'audio';
            if (['mp3', 'wav', 'ogg', 'oga', 'flac', 'aac', 'm4a', 'wma', 'opus', 'weba', 'aiff', 'aif', 'caf', 'mid', 'midi', 'ape', 'dsf', 'dff', 'alac', 'eac3', 'ac3', 'dts', 'amr', 'gsm'].includes(ext)) return 'audio';

            if (mime.startsWith('video/')) return 'video';
            if (['mp4', 'avi', 'mov', 'mkv', 'wmv', 'flv', 'webm', 'm4v', 'mpeg', 'mpg', '3gp'].includes(ext)) return 'video';

            /* Empty or generic MIME — guess from extension only */
            if (!mime || mime === 'application/octet-stream') {
                if (['mp3', 'wav', 'm4a', 'flac', 'aac', 'ogg', 'oga', 'opus', 'weba', 'aiff', 'aif', 'caf', 'wma', 'mid', 'midi'].includes(ext)) return 'audio';
                if (['mp4', 'mov', 'webm', 'mkv', 'avi', 'm4v', 'mpeg', 'mpg'].includes(ext)) return 'video';
                if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'svg'].includes(ext)) return 'image';
                if (ext === 'pdf') return 'pdf';
            }

            // return 'pdf';
            /* ❌ Any other extension like .xlsx, .xls, .sql, .xml, etc. falls here as unsupported */
            return 'unsupported';
        }

        function getCategoryMeta(cat) {
            const map = {

                pdf: { iconClass: 'bi-file-earmark-pdf-fill', boxClass: 'fi-pdf', label: 'application/pdf' },
                image: { iconClass: 'bi-file-earmark-image-fill', boxClass: 'fi-image', label: 'image file' },
                audio: { iconClass: 'bi-file-earmark-music-fill', boxClass: 'fi-audio', label: 'audio file' },
                video: { iconClass: 'bi-file-earmark-play-fill', boxClass: 'fi-video', label: 'video file' },
                word: { iconClass: 'bi-file-earmark-word-fill', boxClass: 'fi-word', label: 'Word document' },
            };
            return map[cat] || map.pdf;
        }

        function formatSize(bytes) {
            if (bytes == null || bytes === '') return '—';
            const n = Number(bytes);
            if (Number.isNaN(n) || n < 0) return '—';
            if (n < 1024) return n + ' B';
            if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
            return (n / (1024 * 1024)).toFixed(2) + ' MB';
        }

        function renderTools(category) {
            const tools = TOOL_SETS[category] || TOOL_SETS.pdf;
            const grid = document.getElementById('toolsGrid');
            grid.innerHTML = tools.map(t => `
      <div class="col-12 col-sm-6 col-lg-4">
        <a href="${t.page}" class="tool-action-card" onclick="saveToolFile(event, '${t.page}')">
          <div class="tac-icon ${t.color}"><i class="bi ${t.icon}"></i></div>
          <p class="tac-name">${t.name}</p>
          <p class="tac-desc">${t.desc}</p>
        </a>
      </div>
    `).join('');
        }
        function saveToolFile(e, page) {
            sessionStorage.setItem('vetri_tool_page', page);
            // ✅ Re-set the flag every time user picks a tool from file-tools
            // This allows Back → pick another tool to work correctly
            sessionStorage.setItem('vetri_from_upload', 'true');
        }

        function idbGetCurrentUploadRecord() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(VETRI_IDB_NAME, 1);
                req.onerror = () => reject(req.error || new Error('idb open failed'));
                req.onsuccess = () => {
                    const db = req.result;
                    try {
                        if (!db.objectStoreNames.contains(VETRI_IDB_STORE)) {
                            db.close();
                            resolve(null);
                            return;
                        }
                        const tx = db.transaction(VETRI_IDB_STORE, 'readonly');
                        const g = tx.objectStore(VETRI_IDB_STORE).get(VETRI_IDB_KEY);
                        g.onsuccess = () => {
                            db.close();
                            resolve(g.result || null);
                        };
                        g.onerror = () => {
                            db.close();
                            reject(g.error);
                        };
                    } catch (err) {
                        try { db.close(); } catch (e) { /* ignore */ }
                        reject(err);
                    }
                };
            });
        }

        function paintFileToolsCard(name, size, mimeForDetect, extFallback) {
            const ext = extFallback != null ? extFallback : getExtension(name);
            const mime = (mimeForDetect || '').toLowerCase();
            const category = detectCategory(mime, ext);
            const typeLabel = mimeForDetect || (ext ? ext.toUpperCase() : 'unknown');
            const catMeta = getCategoryMeta(category);
            document.getElementById('fileName').textContent = name;
            document.getElementById('fileMeta').textContent = formatSize(size) + ' • ' + typeLabel;
            document.getElementById('fileIconBox').className = 'file-icon-box ' + catMeta.boxClass;
            document.getElementById('fileIconEl').className = 'bi ' + catMeta.iconClass;
            renderTools(category);
            return category;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const stored = sessionStorage.getItem('vetri_file');
            const storageType = sessionStorage.getItem('vetri_storage_type');

            let fileName = 'No file selected';
            let fileMeta = '— • —';
            let category = 'pdf';
            let mimeHint = '';

            if (stored) {
                try {
                    const f = JSON.parse(stored);
                    fileName = f.name || 'Unknown file';
                    mimeHint = f.type || '';
                    const ext = getExtension(fileName);
                    category = detectCategory(mimeHint, ext);
                    const typeLabel = mimeHint || (ext ? ext.toUpperCase() : 'unknown');
                    fileMeta = formatSize(f.size) + ' • ' + typeLabel;
                } catch (e) { /* keep defaults */ }
            }

            document.getElementById('fileName').textContent = fileName;

<script>
        /* Same IndexedDB as index.html + vetri-file-helper.js */
        const VETRI_IDB_NAME = 'VetriFilesDB';
        const VETRI_IDB_STORE = 'files';
        const VETRI_IDB_KEY = 'current_file';

        /* ══════════════════════════════════════════════════
           TOOL DEFINITIONS BY FILE CATEGORY
        ══════════════════════════════════════════════════ */
        const TOOL_SETS = {
            pdf: [
                { icon: 'bi-arrow-left-right', color: 'tac-blue-1', name: 'Compress Format', desc: 'Click to get started', page: '/tool-compress-pdf' },
                { icon: 'bi-pen-fill', color: 'tac-blue-2', name: 'Add Signature', desc: 'Click to get started', page: '/tool-add-signature' },
                { icon: 'bi-lock-fill', color: 'tac-blue-3', name: 'Lock PDF', desc: 'Click to get started', page: '/tool-lock-pdf' },
                { icon: 'bi-unlock-fill', color: 'tac-blue-4', name: 'Unlock PDF', desc: 'Click to get started', page: '/tool-unlock-pdf' },
                { icon: 'bi-diagram-2-fill', color: 'tac-blue-5', name: 'Split PDF', desc: 'Click to get started', page: '/tool-split-pdf' },
                { icon: 'bi-intersect', color: 'tac-blue-6', name: 'Merge PDF', desc: 'Click to get started', page: '/tool-merge-pdf' },
                { icon: 'bi-file-earmark-word-fill', color: 'tac-indigo-1', name: 'PDF to Word', desc: 'Click to get started', page: '/tool-pdf-word' },
            ],
            image: [
                { icon: 'bi-arrow-left-right', color: 'tac-teal-1', name: 'Convert Format', desc: 'Click to get started', page: '/tool-convert-image' },
                { icon: 'bi-crop', color: 'tac-teal-2', name: 'Crop Image', desc: 'Click to get started', page: '/tool-crop-image' },
                { icon: 'bi-arrows-fullscreen', color: 'tac-teal-3', name: 'Resize Image', desc: 'Click to get started', page: '/tool-resize-image' },
                { icon: 'bi-droplet-fill', color: 'tac-teal-4', name: 'Add Watermark', desc: 'Click to get started', page: '/tool-watermark-image' },
                { icon: 'bi-file-earmark-zip-fill', color: 'tac-teal-6', name: 'Remove Background Image', desc: 'Click to get started', page: '/tool-remove-background' },
            ],
            audio: [
                { icon: 'bi-arrow-left-right', color: 'tac-purple-1', name: 'Compress Audio', desc: 'Click to get started', page: '/tool-compress-audio' },
                { icon: 'bi-scissors', color: 'tac-purple-2', name: 'Trim Audio', desc: 'Click to get started', page: '/tool-trim-audio' },
                { icon: 'bi-intersect', color: 'tac-purple-3', name: 'Merge Audio', desc: 'Click to get started', page: '/tool-merge-audio' },
            ],
            video: [
                { icon: 'bi-arrow-left-right', color: 'tac-pink-1', name: 'Compress Video', desc: 'Click to get started', page: '/tool-compress-video' },
                { icon: 'bi-scissors', color: 'tac-pink-2', name: 'Trim Video', desc: 'Click to get started', page: '/tool-trim-video' },
                { icon: 'bi-music-note-beamed', color: 'tac-pink-3', name: 'Extract Audio', desc: 'Click to get started', page: '/tool-extract-audio-video' },
            ],
            word: [
                { icon: 'bi-file-earmark-pdf-fill', color: 'tac-indigo-1', name: 'Word to PDF', desc: 'Convert .doc / .docx to PDF', page: '/tool-word-pdf' },
                { icon: 'bi-file-earmark-code-fill', color: 'tac-indigo-2', name: 'Word to HTML', desc: 'Export document as HTML page', page: '/tool-word-html' },
                { icon: 'bi-file-earmark-text-fill', color: 'tac-indigo-3', name: 'Extract Text', desc: 'Pull plain text from Word file', page: '/tool-word-text' },
            ],
            unsupported: [] // Empty list for unsupported formats
        };

        function getExtension(fileName) {
            if (!fileName || typeof fileName !== 'string') return '';
            const i = fileName.lastIndexOf('.');
            if (i <= 0 || i === fileName.length - 1) return '';
            return fileName.slice(i + 1).toLowerCase();
        }

        function detectCategory(mime, ext) {
            mime = (mime || '').toLowerCase();
            ext = (ext || '').toLowerCase();

            if (mime === 'application/pdf' || ext === 'pdf') return 'pdf';

            // Word documents
            if (
                mime === 'application/msword' ||
                mime === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' ||
                mime === 'application/vnd.ms-word' ||
                ext === 'doc' || ext === 'docx'
            ) return 'word';

            if (mime.startsWith('image/')) return 'image';
            if (['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp', 'svg', 'svgz', 'tiff', 'tif', 'ico', 'avif'].includes(ext)) return 'image';

            if (mime.startsWith('audio/')) return 'audio';
            if (['mp3', 'wav', 'ogg', 'oga', 'flac', 'aac', 'm4a', 'wma', 'opus', 'weba', 'aiff', 'aif', 'caf', 'mid', 'midi', 'ape', 'dsf', 'dff', 'alac', 'eac3', 'ac3', 'dts', 'amr', 'gsm'].includes(ext)) return 'audio';

            if (mime.startsWith('video/')) return 'video';
            if (['mp4', 'avi', 'mov', 'mkv', 'wmv', 'flv', 'webm', 'm4v', 'mpeg', 'mpg', '3gp'].includes(ext)) return 'video';

            /* ❌ Any unwanted extension like .xlsx, .xls, .sql, .xml, etc. is routed here as unsupported */
            return 'unsupported';
        }

        function getCategoryMeta(cat) {
            const map = {
                pdf: { iconClass: 'bi-file-earmark-pdf-fill', boxClass: 'fi-pdf', label: 'application/pdf' },
                image: { iconClass: 'bi-file-earmark-image-fill', boxClass: 'fi-image', label: 'image file' },
                audio: { iconClass: 'bi-file-earmark-music-fill', boxClass: 'fi-audio', label: 'audio file' },
                video: { iconClass: 'bi-file-earmark-play-fill', boxClass: 'fi-video', label: 'video file' },
                word: { iconClass: 'bi-file-earmark-word-fill', boxClass: 'fi-word', label: 'Word document' },
                unsupported: { iconClass: 'bi-exclamation-triangle-fill', boxClass: 'fi-default', label: 'unsupported file format' }
            };
            return map[cat] || map.unsupported;
        }

        function formatSize(bytes) {
            if (bytes == null || bytes === '') return '—';
            const n = Number(bytes);
            if (Number.isNaN(n) || n < 0) return '—';
            if (n < 1024) return n + ' B';
            if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
            return (n / (1024 * 1024)).toFixed(2) + ' MB';
        }

        function renderTools(category) {
            const tools = TOOL_SETS[category] || [];
            const grid = document.getElementById('toolsGrid');

            if (category === 'unsupported' || tools.length === 0) {
                grid.innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-danger p-4 text-center rounded-4 border-0 shadow-sm" style="background: #FEF2F2; color: #991B1B;">
                            <i class="bi bi-exclamation-octagon-fill fs-1 mb-2 d-block"></i>
                            <h4 class="fw-bold mb-1">Unsupported File Format</h4>
                            <p class="mb-3">This file type cannot be processed by Vetri Files. Please upload a valid PDF, document, image, audio, or video file.</p>
                            <a href="/" class="btn btn-danger rounded-pill px-4 fw-semibold text-white">Upload a Different File</a>
                        </div>
                    </div>
                `;
                return;
            }

            grid.innerHTML = tools.map(t => `
              <div class="col-12 col-sm-6 col-lg-4">
                <a href="${t.page}" class="tool-action-card" onclick="saveToolFile(event, '${t.page}')">
                  <div class="tac-icon ${t.color}"><i class="bi ${t.icon}"></i></div>
                  <p class="tac-name">${t.name}</p>
                  <p class="tac-desc">${t.desc}</p>
                </a>
              </div>
            `).join('');
        }

        function saveToolFile(e, page) {
            sessionStorage.setItem('vetri_tool_page', page);
            sessionStorage.setItem('vetri_from_upload', 'true');
        }

        function idbGetCurrentUploadRecord() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(VETRI_IDB_NAME, 1);
                req.onerror = () => reject(req.error || new Error('idb open failed'));
                req.onsuccess = () => {
                    const db = req.result;
                    try {
                        if (!db.objectStoreNames.contains(VETRI_IDB_STORE)) {
                            db.close();
                            resolve(null);
                            return;
                        }
                        const tx = db.transaction(VETRI_IDB_STORE, 'readonly');
                        const g = tx.objectStore(VETRI_IDB_STORE).get(VETRI_IDB_KEY);
                        g.onsuccess = () => {
                            db.close();
                            resolve(g.result || null);
                        };
                        g.onerror = () => {
                            db.close();
                            reject(g.error);
                        };
                    } catch (err) {
                        try { db.close(); } catch (e) { /* ignore */ }
                        reject(err);
                    }
                };
            });
        }

        function paintFileToolsCard(name, size, mimeForDetect, extFallback) {
            const ext = extFallback != null ? extFallback : getExtension(name);
            const mime = (mimeForDetect || '').toLowerCase();
            const category = detectCategory(mime, ext);
            const typeLabel = mimeForDetect || (ext ? ext.toUpperCase() : 'unknown');
            const catMeta = getCategoryMeta(category);
            document.getElementById('fileName').textContent = name;
            document.getElementById('fileMeta').textContent = formatSize(size) + ' • ' + typeLabel;
            document.getElementById('fileIconBox').className = 'file-icon-box ' + catMeta.boxClass;
            document.getElementById('fileIconEl').className = 'bi ' + catMeta.iconClass;
            renderTools(category);
            return category;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const stored = sessionStorage.getItem('vetri_file');
            const storageType = sessionStorage.getItem('vetri_storage_type');

            let fileName = 'No file selected';
            let fileMeta = '— • —';
            let category = 'pdf';
            let mimeHint = '';

            if (stored) {
                try {
                    const f = JSON.parse(stored);
                    fileName = f.name || 'Unknown file';
                    mimeHint = f.type || '';
                    const ext = getExtension(fileName);
                    category = detectCategory(mimeHint, ext);
                    const typeLabel = mimeHint || (ext ? ext.toUpperCase() : 'unknown');
                    fileMeta = formatSize(f.size) + ' • ' + typeLabel;
                } catch (e) { /* keep defaults */ }
            }

            document.getElementById('fileName').textContent = fileName;
            document.getElementById('fileMeta').textContent = fileMeta;

            let meta = getCategoryMeta(category);
            let iconBox = document.getElementById('fileIconBox');
            let iconEl = document.getElementById('fileIconEl');
            iconBox.className = 'file-icon-box ' + meta.boxClass;
            iconEl.className = 'bi ' + meta.iconClass;

            renderTools(category);

            if (storageType === 'indexeddb') {
                idbGetCurrentUploadRecord()
                    .then((record) => {
                        if (!record || !record.file) return;
                        const file = record.file;
                        const name = file.name || fileName;
                        const ext = getExtension(name);
                        const mime = file.type || mimeHint || '';
                        paintFileToolsCard(name, file.size != null ? file.size : (JSON.parse(stored || '{}').size || 0), mime, ext);
                    })
                    .catch(() => { /* keep sessionStorage-based UI */ });
            }
        });
    </script>
